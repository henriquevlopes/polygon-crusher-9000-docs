site_name: Polygon Crusher 9000
site_description: Blender add-on to reduce triangles or rebuild a model as clean quads
site_author: Henri Lopes
site_url: https://henriquevlopes.github.io/polygon-crusher-9000-docs/

theme:
  name: readthedocs
  logo: assets/logo.svg
  favicon: assets/logo.svg
  highlightjs: false
  prev_next_buttons_location: bottom
  navigation_depth: 3
  collapse_navigation: false
  sticky_navigation: true

nav:
  - Home: index.md
  - What's New: whats-new.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - Examples: examples.md
  - Settings Reference: settings.md
  - Features:
    - Source Types: features/source-types.md
    - Target Modes: features/target-modes.md
    - Remesh (Quads): features/remesh.md
    - Quad Density: features/quad-density.md
    - Hard Surface and Sharps: features/hard-surface.md
    - Show Hard Edges: features/show-hard-edges.md
    - Protect Areas: features/protect.md
    - Clean Mesh and Scan Repair: features/clean-mesh.md
    - Import and Crush: features/import-crush.md
    - Bake Maps and Auto UVs: features/bake-maps.md
    - LODs: features/lods.md
    - Keep Original and Revert: features/revert.md
    - Rigs, Shape Keys and Vertex Colors: features/carry-over.md
  - Limits: limits.md
  - Benchmark: benchmark.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false

plugins:
  - search

extra_css:
  - stylesheets/extra.css
