site_name: Polygon Crusher 9000
site_description: Blender addon for fast, normal-preserving mesh decimation
site_author: Henri Lopes
site_url: https://henriquevlopes.github.io/polygon-crusher-9000-docs/

theme:
  name: readthedocs
  logo: assets/logo.svg
  favicon: assets/logo.svg
  highlightjs: false
  prev_next_buttons_location: bottom
  navigation_depth: 3
  collapse_navigation: false
  sticky_navigation: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - Examples: examples.md
  - Settings Reference: settings.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
